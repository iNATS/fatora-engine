[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fatora-engine"
version = "0.1.0"
description = "Open-source invoice and receipt extraction with evidence-backed validation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["invoice", "receipt", "ocr", "document-ai", "arabic", "extraction"]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[project.scripts]
fatora = "fatora.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fatora"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
